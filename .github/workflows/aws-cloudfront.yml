name: Deploy to AWS CloudFront

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/aws-cloudfront.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-cloudfront-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          allowed-account-ids: 864138843126
          role-session-name: KitsosCdnGitHubDeploy

      - name: Sync public files to S3
        env:
          BUCKET: ${{ vars.AWS_S3_BUCKET }}
        run: |
          set -euo pipefail

          # Base sync + deleted files entfernen
          aws s3 sync public/ "s3://${BUCKET}/" \
            --delete \
            --only-show-errors

          # WOFF2 fonts: 7 days
          aws s3 cp public/ "s3://${BUCKET}/" \
            --recursive \
            --exclude "*" \
            --include "*.woff2" \
            --content-type "font/woff2" \
            --cache-control "public, max-age=604800, stale-while-revalidate=86400" \
            --only-show-errors

          # CSS: 1 hour
          aws s3 cp public/ "s3://${BUCKET}/" \
            --recursive \
            --exclude "*" \
            --include "*.css" \
            --content-type "text/css; charset=utf-8" \
            --cache-control "public, max-age=3600, stale-while-revalidate=86400" \
            --only-show-errors

          # JavaScript: 1 day
          aws s3 cp public/ "s3://${BUCKET}/" \
            --recursive \
            --exclude "*" \
            --include "*.js" \
            --content-type "application/javascript; charset=utf-8" \
            --cache-control "public, max-age=86400, stale-while-revalidate=86400" \
            --only-show-errors

          # SVG: 7 days
          aws s3 cp public/ "s3://${BUCKET}/" \
            --recursive \
            --exclude "*" \
            --include "*.svg" \
            --content-type "image/svg+xml" \
            --cache-control "public, max-age=604800, stale-while-revalidate=86400" \
            --only-show-errors

          # Other images: 7 days
          aws s3 cp public/ "s3://${BUCKET}/" \
            --recursive \
            --exclude "*" \
            --include "*.png" \
            --include "*.webp" \
            --include "*.avif" \
            --include "*.ico" \
            --cache-control "public, max-age=604800, stale-while-revalidate=86400" \
            --only-show-errors

          # JSON: 1 hour
          aws s3 cp public/ "s3://${BUCKET}/" \
            --recursive \
            --exclude "*" \
            --include "*.json" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=3600, stale-while-revalidate=86400" \
            --only-show-errors

          # Generic YAML/YML MIME type
          aws s3 cp public/ "s3://${BUCKET}/" \
            --recursive \
            --exclude "*" \
            --include "*.yaml" \
            --include "*.yml" \
            --content-type "application/yaml; charset=utf-8" \
            --only-show-errors

          # Versioned Kitsos npm packages are immutable for one year.
          #
          # IMPORTANT: use `cp` (not another `sync`) here intentionally.
          # The base sync may skip byte-identical objects, while this second PUT
          # must also replace metadata on versions that were already deployed.
          #
          # Package archives: explicit binary MIME type + immutable caching.
          if [ -d public/packages/npm/@kitsos ]; then
            aws s3 cp public/packages/npm/@kitsos/ "s3://${BUCKET}/packages/npm/@kitsos/" \
              --recursive \
              --exclude "*" \
              --include "*/v*/*.tgz" \
              --content-type "application/octet-stream" \
              --cache-control "public, max-age=31536000, immutable" \
              --only-show-errors

            # Package checksums: explicit UTF-8 text MIME type + immutable caching.
            aws s3 cp public/packages/npm/@kitsos/ "s3://${BUCKET}/packages/npm/@kitsos/" \
              --recursive \
              --exclude "*" \
              --include "*/v*/*.sha256" \
              --content-type "text/plain; charset=utf-8" \
              --cache-control "public, max-age=31536000, immutable" \
              --only-show-errors
          fi

          # Verify deployed npm package metadata in S3.
          # These checks fail the deployment if an existing object did not
          # receive the immutable cache policy or the expected MIME type.
          verify_package_metadata() {
            local file="$1"
            local expected_type="$2"
            local key="${file#public/}"

            local actual_type actual_cache
            actual_type="$(aws s3api head-object \
              --bucket "${BUCKET}" \
              --key "${key}" \
              --query 'ContentType' \
              --output text)"
            actual_cache="$(aws s3api head-object \
              --bucket "${BUCKET}" \
              --key "${key}" \
              --query 'CacheControl' \
              --output text)"

            if [ "${actual_type}" != "${expected_type}" ]; then
              echo "::error file=${file}::Unexpected S3 Content-Type: ${actual_type} (expected ${expected_type})"
              exit 1
            fi

            if [ "${actual_cache}" != "public, max-age=31536000, immutable" ]; then
              echo "::error file=${file}::Unexpected S3 Cache-Control: ${actual_cache}"
              exit 1
            fi

            echo "Verified ${key}: ${actual_type}; ${actual_cache}"
          }

          while IFS= read -r -d '' file; do
            verify_package_metadata "${file}" "application/octet-stream"
          done < <(find public/packages/npm/@kitsos -type f -path '*/v*/*.tgz' -print0 2>/dev/null || true)

          while IFS= read -r -d '' file; do
            verify_package_metadata "${file}" "text/plain; charset=utf-8"
          done < <(find public/packages/npm/@kitsos -type f -path '*/v*/*.sha256' -print0 2>/dev/null || true)

          # Current OpenAPI specs: never cache
          aws s3 cp public/ "s3://${BUCKET}/" \
            --recursive \
            --exclude "*" \
            --include "api/*/openapi.yaml" \
            --content-type "application/yaml; charset=utf-8" \
            --cache-control "no-store, max-age=0, must-revalidate" \
            --only-show-errors

          # Versioned OpenAPI specs: immutable for one year
          aws s3 cp public/ "s3://${BUCKET}/" \
            --recursive \
            --exclude "*" \
            --include "api/*/openapi-*.yaml" \
            --content-type "application/yaml; charset=utf-8" \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors

          # Health probe: never cache
          if [ -f public/health/asset-probe.txt ]; then
            aws s3 cp \
              public/health/asset-probe.txt \
              "s3://${BUCKET}/health/asset-probe.txt" \
              --content-type "text/plain; charset=utf-8" \
              --cache-control "no-store, max-age=0, must-revalidate" \
              --only-show-errors
          fi

          # CDN benchmark probe:
          # - browser revalidates on every use (max-age=0)
          # - shared/CDN caches may keep it for 24h (s-maxage)
          # - stale edge copy may be served for up to 7d during origin trouble
          if [ -f public/health/cdn-probe-v2.txt ]; then
            aws s3 cp \
              public/health/cdn-probe-v2.txt \
              "s3://${BUCKET}/health/cdn-probe-v2.txt" \
              --content-type "text/plain; charset=utf-8" \
              --cache-control "public, max-age=0, s-maxage=86400, stale-while-revalidate=604800" \
              --only-show-errors
          fi

          # Custom 404: never cache
          if [ -f public/404.html ]; then
            aws s3 cp \
              public/404.html \
              "s3://${BUCKET}/404.html" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-store" \
              --only-show-errors
          fi

      - name: Invalidate CloudFront cache
        id: invalidate
        run: |
          set -euo pipefail
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"

          echo "CloudFront invalidation requested: ${INVALIDATION_ID}"
          # The existing deploy role can create invalidations but intentionally
          # does not have cloudfront:GetInvalidation. The following live smoke
          # test retries until the invalidated package response is refreshed.

      - name: Verify versioned npm package headers through CloudFront
        run: |
          set -euo pipefail

          TGZ="public/packages/npm/@kitsos/consent/v1.0.0/kitsos-consent-1.0.0.tgz"
          SHA="${TGZ}.sha256"

          # Only run the concrete v1.0.0 smoke test when that immutable release
          # exists in this checkout.
          if [ ! -f "${TGZ}" ] || [ ! -f "${SHA}" ]; then
            echo "Consent v1.0.0 package not present; skipping concrete CloudFront smoke test."
            exit 0
          fi

          assert_header() {
            local url="$1"
            local expected_type="$2"
            local headers attempt

            for attempt in {1..18}; do
              headers="$(curl --fail --silent --show-error --head "${url}")"
              if printf '%s\n' "${headers}" | tr -d '\r' | grep -Fqi "cache-control: public, max-age=31536000, immutable" \
                && printf '%s\n' "${headers}" | tr -d '\r' | grep -Fqi "content-type: ${expected_type}"; then
                printf '%s\n' "${headers}"
                echo "CloudFront package headers verified on attempt ${attempt}."
                return 0
              fi

              echo "CloudFront still serving old/incomplete metadata (attempt ${attempt}/18); retrying in 10s..."
              sleep 10
            done

            printf '%s\n' "${headers}"
            echo "::error::CloudFront did not expose the expected immutable package headers after invalidation."
            return 1
          }

          assert_header \
            "https://b.cdn.kitsos.net/packages/npm/@kitsos/consent/v1.0.0/kitsos-consent-1.0.0.tgz" \
            "application/octet-stream"

          assert_header \
            "https://b.cdn.kitsos.net/packages/npm/@kitsos/consent/v1.0.0/kitsos-consent-1.0.0.tgz.sha256" \
            "text/plain; charset=utf-8"
