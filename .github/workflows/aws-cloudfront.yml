name: Deploy to AWS CloudFront

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/aws-cloudfront.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-cloudfront-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          allowed-account-ids: 864138843126
          role-session-name: KitsosCdnGitHubDeploy

      - name: Sync public files to S3
        run: |
          aws s3 sync public/ "s3://${{ vars.AWS_S3_BUCKET }}/" \
            --delete \
            --only-show-errors

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
